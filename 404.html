<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{--bg:#08080b;--ink:#f4f4f8;--mut:#a2a2b0;--line:#23232e;--brand:#e8005a;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  display:grid;place-items:center;text-align:center;padding:24px;position:relative;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(50% 40% at 50% 30%,rgba(232,0,90,.30),transparent 70%),radial-gradient(40% 40% at 80% 90%,rgba(242,0,137,.16),transparent 72%)}
.box{position:relative;z-index:1;max-width:460px}
.logo{width:56px;height:66px;margin:0 auto 26px;display:block}
.code{font-size:clamp(64px,16vw,110px);font-weight:800;letter-spacing:-.04em;line-height:1;margin:0 0 6px}
.code span{color:var(--brand)}
h1{font-size:clamp(20px,4vw,26px);font-weight:700;letter-spacing:-.02em;margin:0 0 12px}
p{color:var(--mut);font-size:16px;line-height:1.55;margin:0 auto 28px;max-width:38ch}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{text-decoration:none;font-weight:600;font-size:15px;padding:13px 22px;border-radius:999px;transition:.2s}
.primary{background:var(--brand);color:#fff}
.primary:hover{filter:brightness(1.08)}
.ghost{color:var(--ink);border:1px solid var(--line)}
.ghost:hover{border-color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
</style></head><body>
